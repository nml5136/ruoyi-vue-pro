# Isolated loopback development only. Supply new local credentials outside the repository.
spring.application.name=ilvy-host-dev
server.address=127.0.0.1
server.port=48082
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
spring.main.banner-mode=off
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
logging.config=file:${ILVY_DEPLOY_DIR}/logback.xml
logging.level.root=WARN
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.dynamic.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:43306/ilvy_dev?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.dynamic.datasource.master.username=ilvy_dev
spring.datasource.dynamic.datasource.master.password=${ILVY_DB_PASSWORD}
spring.redis.host=127.0.0.1
spring.redis.port=46379
spring.redis.database=0
spring.quartz.auto-startup=false
spring.flyway.enabled=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.type-aliases-package=cn.iocoder.yudao.module.*.dal.dataobject
yudao.info.base-package=cn.iocoder.yudao
yudao.info.version=ilvy-dev
yudao.web.admin-ui.url=http://127.0.0.1:48082
yudao.tenant.enable=true
yudao.security.mock-enable=false
yudao.captcha.enable=false
yudao.access-log.enable=false
yudao.error-log.enable=false
yudao.websocket.enable=false
springdoc.api-docs.enabled=false
knife4j.enable=false

spring.profiles.active=ilvy-host
yudao.sms-code.expire-times=5m
yudao.sms-code.send-frequency=1m
yudao.sms-code.send-maximum-quantity-per-day=10
yudao.sms-code.begin-code=100000
yudao.sms-code.end-code=999999
yudao.codegen.base-package=cn.iocoder.yudao
yudao.codegen.db-schemas[0]=ilvy_dev
yudao.codegen.front-type=20
yudao.codegen.vo-type=10
yudao.codegen.delete-batch-enable=false
yudao.codegen.unit-test-enable=false
yudao.codegen.import-enable=false

# Optional private correction images; keep outside source and public web roots.
# Evidence uses the persistent ILVY_TEST_DATA_DIR configured below.
# spring.servlet.multipart.max-file-size=3MB
# spring.servlet.multipart.max-request-size=4MB
# Rebuild derived local catalog indexes after applying V5; no external data import.
# ilvy.catalog-reindex=true
# Physical retention is disabled by default. Do not enable for real user data here.
# ilvy.evidence-purge-enabled=false

# Portable isolated test deployment; never enable irreversible retention here.
ilvy.evidence-directory=${ILVY_TEST_DATA_DIR}/ilvy-evidence
ilvy.catalog-reindex=true
ilvy.evidence-purge-enabled=false
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
